name: Something's not working
description: Report a bug or a problem in Frog Quest+.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping me squash bugs :]
        Support requests are public, so please don't include personal details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what were you doing right before?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where in the game?
      options:
        - Quest mode
        - Endless mode
        - Wardrobe (hats & skins)
        - Remove Ads / purchases
        - Ads or the tracking prompt
        - Somewhere else
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone 16, iPad Air, iPhone Duo
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      description: Settings › General › About
      placeholder: e.g. iOS 27.1
  - type: input
    id: app-version
    attributes:
      label: Frog Quest+ version
      description: Settings › General › iPhone Storage › Frog Quest+
      placeholder: e.g. 1.1
  - type: textarea
    id: steps
    attributes:
      label: Can you make it happen again?
      description: If so, what are the steps? Screenshots help too.
